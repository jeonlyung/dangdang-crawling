spring:
  application:
    name: dangdang-crawling

  # MySQL 설정
  datasource:
    url: jdbc:mysql://localhost:3306/dangdang_crawling?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_ID}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# MyBatis 설정
mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.dangdang.crawling.biz.common.entity

# 로깅 설정
logging:
  level:
    root: INFO
    com.dangdang.crawling: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# 서버 설정
server:
  port: 8081
  servlet:
    context-path: /api

